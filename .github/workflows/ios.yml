name: Build unsigned IPA

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.3
        run: |
          sudo xcode-select -s /Applications/Xcode_26.3.app
          xcodebuild -version

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: |
          xcodegen generate
          ls -d Journal.xcodeproj

      - name: Build unsigned app
        run: |
          xcodebuild -project Journal.xcodeproj \
            -scheme Journal \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Package unsigned IPA
        run: |
          APP_PATH="build/Build/Products/Release-iphoneos/Journal.app"
          test -d "$APP_PATH" || { echo "App bundle not found:"; find build/Build/Products -maxdepth 2; exit 1; }
          if [ -d "$APP_PATH/_CodeSignature" ]; then
            codesign --remove-signature "$APP_PATH"
          fi
          rm -rf Payload Journal.ipa
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -qr Journal.ipa Payload
          unzip -l Journal.ipa | head -20

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: Journal-unsigned
          path: Journal.ipa
          if-no-files-found: error
          retention-days: 30
