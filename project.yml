name: Journal

options:
  deploymentTarget:
    iOS: "17.0"

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGNING_ALLOWED: "NO"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGN_IDENTITY: ""
    TARGETED_DEVICE_FAMILY: "1,2"

targets:
  Journal:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: JournalApp
        excludes:
          - Resources
    resources:
      - path: JournalApp/Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.meowmiya.journal
        PRODUCT_NAME: Journal
        PRODUCT_DISPLAY_NAME: 手帐本
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    info:
      properties:
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UILaunchScreen: {}
        UIAppFonts:
          - MaShanZheng-Regular.ttf
          - ZhiMangXing-Regular.ttf
          - LongCang-Regular.ttf
          - GreatVibes-Regular.ttf
          - DancingScript.ttf
          - Caveat.ttf

schemes:
  Journal:
    build:
      targets:
        Journal: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
